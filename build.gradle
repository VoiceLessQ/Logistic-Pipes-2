plugins {
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.moddev'
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.lombok'
    id 'io.freefair.lombok'
    id 'signing'
    id 'com.gradleup.shadow'
}

archivesBaseName = 'logisticspipes'
group = 'network.rs485'
version = '0.0.2'
ext.vendor = 'unknown'

// MC 1.21.1 runs on Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def ENV = System.getenv()

if (ENV.BUILD_NUMBER) {
    version = "$version.${ENV.BUILD_NUMBER}"
} else if (ENV.VERSION) {
    version = "$version.${ENV.VERSION}"
} else if (!project.hasProperty('release')) {
    // local builds are snapshots unless invoked with -Prelease
    version = "$version-SNAPSHOT"
}

if (ENV.JENKINS_URL) {
    ext.vendor = ENV.JENKINS_URL
} else if (ENV.JITPACK) {
    ext.vendor = 'JitPack.io'
    group = ENV.GROUP
}

ext.sharedManifest = manifest {
    attributes(
        'Specification-Title':      'LogisticsPipes',
        'Specification-Vendor':     'RS485',
        'Specification-Version':    '1',
        'Implementation-Vendor':    "$vendor",
        'Implementation-Title':     "${project.name}",
        'Implementation-Version':   "$version",
        'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"))
}

// Source sets
sourceSets {
    api {
        java { srcDirs = ['src/api/java'] }
    }
    main {
        compileClasspath += api.output
        runtimeClasspath  += api.output
        java      { srcDirs += 'common' }
        resources { srcDirs += 'resources' }
    }
    test {
        compileClasspath += api.output
        runtimeClasspath  += api.output
    }
}

configurations {
    testCompileOnly.extendsFrom compileOnly
    ktlint
}

// NeoForge (ModDevGradle).
// ModDevGradle replaces NeoGradle 7. NeoForge 1.20.2+ runs Mojmap-named at
// runtime, so the old Mojmap to SRG reobf step (srgutils + TinyRemapper) is gone;
// the shadowJar is the shippable artifact directly.
neoForge {
    version = project.neoforge_version

    // The api source set is separate from main, so wire the MC/NeoForge classpath
    // onto it too (MDG only adds it to main by default).
    addModdingDependenciesTo sourceSets.api

    accessTransformers {
        from rootProject.file('resources/META-INF/lp_at.cfg')
    }

    mods {
        logisticspipes {
            sourceSet sourceSets.main
            sourceSet sourceSets.api
        }
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers',       'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            jvmArgument '-ea'
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            systemProperty 'forge.logging.markers',       'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            programArgument '--nogui'
            jvmArgument '-ea'
        }
    }
}

// Kotlin
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
        freeCompilerArgs.add('-Xjvm-default=all')
    }
}

kotlinLombok {
    lombokConfigurationFile file('lombok.config')
}

// Dependencies
repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.removeco.de/' }
    maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    // Kotlin for Forge (NeoForge 1.21.1) provides kotlin stdlib + coroutines +
    // serialization as a mod module on the ModLauncher path at runtime and acts
    // as the language provider (modLoader = "kotlinforforge").
    implementation "thedarkcolour:kotlinforforge-neoforge:${kff_version}"
    // compileOnly: KFF supplies kotlin stdlib/coroutines/serialization at runtime;
    // having them on the runtime module path too breaks module resolution
    // ("reads more than one module named kotlin.stdlib.jdk8").
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${kotlin_version}"
    compileOnly "org.jetbrains:annotations:${kannotations_version}"
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core:${kcoroutines_version}"
    compileOnly "org.jetbrains.kotlinx:kotlinx-serialization-json:${kserialization_version}"
    apiCompileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
    apiCompileOnly "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${kotlin_version}"
    apiCompileOnly "org.jetbrains:annotations:${kannotations_version}"
    // Tests run without KFF, so they need the Kotlin runtime directly.
    testImplementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${kotlin_version}"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${kcoroutines_version}"
    testImplementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${kserialization_version}"
    implementation("com.charleskorn.kaml:kaml:${kaml_version}") {
        // KFF provides the Kotlin runtime as a module; a transitive copy on the
        // classpath breaks module resolution (duplicate kotlin.stdlib).
        transitive = false
    }
    compileOnly "com.charleskorn.kaml:kaml-jvm:${kaml_version}"


    // Bundled libs also need to be on the dev runtime classpath.
    additionalRuntimeClasspath("com.charleskorn.kaml:kaml:${kaml_version}") {
        transitive = false
    }
    additionalRuntimeClasspath("com.charleskorn.kaml:kaml-jvm:${kaml_version}") {
        transitive = false
    }
    additionalRuntimeClasspath 'org.snakeyaml:snakeyaml-engine:2.3'

    // JEI API for compile; runtime JEI is optional.
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.21.1.312"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.21.1.312"

    ktlint("com.pinterest:ktlint:0.50.0") {
        attributes {
            attribute(Bundling.BUNDLING_ATTRIBUTE, getObjects().named(Bundling, Bundling.EXTERNAL))
        }
    }

    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
}

// JAR / Shadow
jar {
    from sourceSets.api.output
    archiveClassifier.set('dev')          // dev jar; not the published artifact
    duplicatesStrategy = DuplicatesStrategy.WARN
    manifest { from sharedManifest }
}

// Production artifact (no reobf on 1.21.1). Bundles main + api classes + kaml +
// snakeyaml. Kotlin stdlib / coroutines / serialization are NOT bundled: KFF
// provides them as a mod module; bundling would create a duplicate Kotlin runtime
// under a relocated namespace and break @Metadata reflection across the KFF/LP seam.
shadowJar {
    from sourceSets.api.output
    archiveClassifier.set('')             // no classifier: this is the shippable jar

    dependencies {
        include(dependency("com.charleskorn.kaml:kaml:${kaml_version}"))
        include(dependency('org.snakeyaml:snakeyaml-engine:2.3'))
    }

    relocate 'org.snakeyaml',        'logisticspipes.snakeyaml'
    relocate 'com.charleskorn.kaml', 'logisticspipes.kaml'

    exclude 'META-INF/versions/9/*'
    exclude 'DebugProbesKt.bin'

    manifest { inheritFrom sharedManifest }
}

// Additional artifacts
task sourceJar(type: Jar) {
    from sourceSets.api.allSource
    from sourceSets.main.allSource
    archiveClassifier.set('sources')
}

task deobfJar(type: Jar) {
    from sourceSets.main.output
    from sourceSets.api.output
    archiveClassifier.set('deobf')
    duplicatesStrategy = DuplicatesStrategy.WARN
    manifest { from sharedManifest }
}

task apiJar(type: Jar, dependsOn: apiClasses) {
    from sourceSets.api.output
    from sourceSets.api.allSource
    archiveClassifier.set('api')
    duplicatesStrategy = DuplicatesStrategy.WARN
}

artifacts {
    archives apiJar
    archives shadowJar
    archives deobfJar
    archives sourceJar
}

// Tests
tasks.withType(Test) {
    useJUnitPlatform()
    testLogging { events('passed', 'skipped', 'failed') }
}

// Resources
processResources {
    inputs.property 'version', project.version
    duplicatesStrategy = DuplicatesStrategy.FAIL
    // neoforge.mods.toml version substitution
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version, mcversion: mcversion
    }
}

// ktlint
task ktlint(type: JavaExec, group: 'verification') {
    description = 'Check Kotlin code style.'
    classpath = configurations.ktlint
    mainClass.set('com.pinterest.ktlint.Main')
    args '**/*.kt'
}
// check.dependsOn ktlint

// Signing
task enableSigningTasks {
    doFirst {
        tasks.withType(Sign) { enabled = true }
    }
}

signing {
    useGpgCmd()
    sign apiJar
    sign shadowJar
    sign deobfJar
    sign sourceJar
}

task sign {
    dependsOn enableSigningTasks
    dependsOn(tasks.withType(Sign))
}

tasks.withType(Sign) {
    enabled = false
    mustRunAfter enableSigningTasks
    ext.useJarsigner = (name.toLowerCase().endsWith('jar') && name != 'signSourceJar')
}

gradle.taskGraph.whenReady { taskGraph ->
    taskGraph.allTasks.each { task ->
        if (task instanceof Sign && task.useJarsigner) {
            task.doFirst {
                task.filesToSign.each { File file ->
                    task.ant.signjar(
                        jar:         file,
                        alias:       '1',
                        storetype:   findProperty('LogisticsPipes.storetype'),
                        keystore:    findProperty('LogisticsPipes.keystore'),
                        storepass:   findProperty('LogisticsPipes.storepass'),
                        verbose:     'true',
                        preservelastmodified: 'true')
                }
            }
        }
    }
}

// Misc
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '5000'
}

tasks.withType(AbstractArchiveTask) {
    preserveFileTimestamps = false
    reproducibleFileOrder  = true
}

tasks.named('wrapper') {
    gradleVersion    = '8.14.4'
    distributionType = Wrapper.DistributionType.ALL
}

clean {
    setDelete(project.fileTree("$buildDir") {
        exclude 'fg_cache'
    })
}

publishing {
    publications {
        mavenJava(MavenPublication) { artifact jar }
    }
    repositories {
        maven { url "file://${project.projectDir}/mcmodsrepo" }
    }
}
