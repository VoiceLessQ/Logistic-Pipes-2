plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
    // Forgix universal-jar build temporarily disabled — re-enabling needs either
    // (a) per-subproject plugins{} apply for loom (Orevein pattern), which currently
    //     conflicts with root subprojects{} dependencies block referencing
    //     loom.officialMojangMappings(), or
    // (b) deferring forgix{} config until after all subprojects evaluate without
    //     using evaluationDependsOn at script scope.
    // Tackled in a follow-up; build is green without it.
    // id 'io.github.pacifistmc.forgix' version '2.0.0-SNAPSHOT.5.1'
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

// Forgix universal-jar config — disabled in tandem with the plugin above; see comment there.
