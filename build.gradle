// Collect both loader JARs into root build/libs after a full build.
tasks.register('collectJars', Copy) {
    dependsOn ':fabric:remapJar', ':neoforge:remapJar'
    from("${project(':fabric').buildDir}/libs") {
        include "${rootProject.archives_name}-fabric-*.jar"
        exclude "*-sources*"
        exclude "*-dev*"
    }
    from("${project(':neoforge').buildDir}/libs") {
        include "${rootProject.archives_name}-neoforge-*.jar"
        exclude "*-sources*"
        exclude "*-dev*"
    }
    into "${rootProject.buildDir}/libs"
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Produce a .sha256 file next to every built loader jar. Useful for paste into
// changelogs / release notes and for verifying upload integrity against
// CurseForge's own hash.
tasks.register('checksums') {
    dependsOn ':fabric:build', ':neoforge:build'
    doLast {
        def jarDirs = [
                project(':fabric').layout.buildDirectory.dir('libs').get().asFile,
                project(':neoforge').layout.buildDirectory.dir('libs').get().asFile
        ]
        jarDirs.each { dir ->
            if (!dir.exists()) return
            fileTree(dir).matching {
                include "${rootProject.archives_name}-*.jar"
                exclude "*-sources*"
                exclude "*-dev*"
            }.each { file ->
                def hash = java.security.MessageDigest.getInstance("SHA-256")
                        .digest(file.bytes)
                        .collect { String.format("%02x", it) }.join()
                new File(file.path + ".sha256").text = "${hash}  ${file.name}\n"
                println "SHA-256: ${hash}  ${file.name}"
            }
        }
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
