plugins {
    id 'net.fabricmc.fabric-loom'
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.lombok'
    id 'io.freefair.lombok'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

sourceSets {
    main {
        java { srcDirs = ['src/main/java', 'src/api/java', 'common'] }
        kotlin { srcDirs = ['src/main/kotlin', 'src/api/kotlin', 'src/main/java', 'src/api/java', 'common'] }
        resources { srcDirs = ['resources'] }
    }
}

// groups the Java + Kotlin class dirs with resources so ModContainer.getRootPaths() sees the classes in dev
loom {
    mods {
        logisticspipes { sourceSet sourceSets.main }
    }
    // dev-only test commands (/lptest), see logisticspipes.proxy.DevTestCommands
    if (project.hasProperty('lpDevtest')) {
        runs { configureEach { vmArg '-Dlp.devtest=true' } }
    }
}

repositories {
    maven { url = 'https://maven.squiddev.cc'; content { includeGroup 'cc.tweaked' } }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    implementation("teamreborn:energy:${project.tr_energy_version}") { transitive = false }
    include "teamreborn:energy:${project.tr_energy_version}"

    // IC2 Reborn has no published artifact; soft dependency (logisticspipes.proxy.IC2RebornEnergy)
    compileOnly files('libs/ic2-reborn-0.1.5-alpha-treetapfix.jar')

    // CC:Tweaked soft dependency (logisticspipes.proxy.cc); dev runs load the mod jar from run/mods
    compileOnly "cc.tweaked:cc-tweaked-${project.minecraft_version}-fabric-api:${project.cc_tweaked_version}"

    implementation "com.charleskorn.kaml:kaml:${project.kaml_version}"
    include "com.charleskorn.kaml:kaml:${project.kaml_version}"
}

lombok { version = '1.18.48' }

kotlinLombok { lombokConfigurationFile file('lombok.config') }

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand 'version': version }
}

jar {
    manifest {
        attributes(
            'Specification-Title':    'LogisticsPipes',
            'Specification-Vendor':   'RS485',
            'Specification-Version':  '1',
            'Implementation-Title':   project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor':  'RS485',
            'Implementation-Target':  "Fabric ${project.minecraft_version}")
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs += ['-Xmaxerrs', '100000', '-XDshould-stop.ifError=FLOW']
    it.options.fork = true
    it.options.forkOptions.memoryMaximumSize = '8g'
}

kotlin {
    jvmToolchain(25)
    compilerOptions {
        freeCompilerArgs.add('-Xjvm-default=all')
        // MC 26.x is @NullMarked, but vanilla still passes null (e.g. slotClicked on outside clicks); keep overrides nullable
        freeCompilerArgs.add('-Xjspecify-annotations=warn')
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
