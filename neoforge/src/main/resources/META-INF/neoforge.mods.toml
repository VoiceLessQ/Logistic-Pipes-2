modLoader = "javafml"
# javafml is at 4.x on NeoForge 21.1.x — was "[10,)" (Forge 1.20.1 scheme) which
# fails the load with "Mod needs language provider javafml:10 or above to load".
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/VoiceLessQ/Logistic-Pipes-2/issues"
license = "MMPL-1.0.1"

[[mods]]
modId = "morph"
version = "${version}"
displayName = "Logistic Pipes 2"
authors = "NoZeroG (VoiceLessQ)"
description = '''
Request-based item routing, automated crafting, and modular chassis pipes — a revival of LogisticsPipes for modern Minecraft.
'''
#logoFile = ""

[[dependencies.morph]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.morph]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "morph.mixins.json"
