modLoader   = "kotlinforforge"
loaderVersion = "[5,)"
license     = "MMPL-1.0.1"

[[mods]]
    modId       = "logisticspipes"
    version     = "${version}"
    displayName = "Logistic Pipes 2"
    description = '''
        Logistic Pipes 2 is a NeoForge 1.21.1 revival of the classic Logistics Pipes:
        request-based item routing, automated crafting, and modular chassis pipes,
        brought back to modern Minecraft.

        Originally by Krapht; 1.12.2 codebase by the RS485 LP team. This port is
        maintained by NoZeroG and distributed under the MMPL-1.0.1.
    '''
    authors     = "NoZeroG (NeoForge port), RS485 & LP Team (original 1.12.2), Krapht (original concept)"
    displayURL       = "https://github.com/VoiceLessQ/Logistic-Pipes-2"
    issueTrackerURL  = "https://github.com/VoiceLessQ/Logistic-Pipes-2/issues"

[[dependencies.logisticspipes]]
    modId        = "neoforge"
    mandatory    = true
    versionRange = "[21.1,)"
    ordering     = "NONE"
    side         = "BOTH"

[[dependencies.logisticspipes]]
    modId        = "minecraft"
    mandatory    = true
    # Pinned to 1.21.1 only: a single MC version avoids cross-version mapping
    # crashes and gives a clean "wrong version" screen instead.
    versionRange = "[1.21.1,1.21.2)"
    ordering     = "NONE"
    side         = "BOTH"

[[dependencies.logisticspipes]]
    modId        = "kotlinforforge"
    mandatory    = true
    versionRange = "[5,)"
    ordering     = "NONE"
    side         = "BOTH"

# JEI — optional integration. Not listed as a dependency right now because JEI
# cannot load on NeoForge 1.20.1 due to an SRG-name remap gap (see MIGRATION.md).
# Re-add this block when JEI runtime support is verified:
